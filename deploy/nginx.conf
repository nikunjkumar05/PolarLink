server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 200 MB in the API (MAX_UPLOAD_BYTES); leave headroom
    # for the multipart envelope, otherwise nginx 413s before FastAPI sees it.
    client_max_body_size 210m;

    # Large archives plus embedding work can be slow on first contact.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ^~ so the API never falls through to the static-file regex below.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's hashed bundles are cacheable forever. This must stay a regex match:
    # a prefix location on /assets/ would also swallow the SPA route /assets/:id,
    # which has no extension and has to fall through to index.html.
    location ~* \.(?:js|mjs|css|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every route (/search, /assets/1, /read/:slug, …) is
    # client-side. Real files win; anything else renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
